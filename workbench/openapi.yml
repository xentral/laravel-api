openapi: 3.1.0
info:
  title: 'My API'
  description: 'Developer API'
  contact:
    name: 'API Support'
    url: 'https://example.com'
    email: api@example.com
  version: 1.0.0
servers:
  -
    url: 'https://example.com'
    description: 'Your API environment'
paths:
  /api/v1/customers:
    get:
      summary: '🔒 List customers V1'
      description: "This endpoint is only available if the feature flag `beta-customers` is enabled.\n\nList customers"
      operationId: 'GET::api-v1-customers'
      parameters:
        -
          name: filter
          in: query
          description: "The filter parameter is used to filter the results of the given endpoint. \n\n\n**Supported filter operators by key:** \n\n`id`: *equals*, *notEquals*, *in*, *notIn*, *isNull*, *isNotNull* \n\n`name`: *equals*, *notEquals*, *in*, *notIn*, *contains*, *notContains*, *startsWith*, *endsWith*, *isNull*, *isNotNull* \n\n`email`: *equals*, *notEquals*, *in*, *notIn*, *contains*, *notContains*, *startsWith*, *endsWith*, *isNull*, *isNotNull* \n\n`country`: *equals*, *notEquals*, *in*, *notIn*, *contains*, *notContains*, *startsWith*, *endsWith*, *isNull*, *isNotNull*"
          required: false
          style: deepObject
          schema:
            type: array
            items:
              properties:
                key:
                  type: string
                  enum: [id, name, email, country]
                op:
                  description: operator
                  type: string
                  enum: [equals, notEquals, in, notIn, isNull, isNotNull, contains, notContains, startsWith, endsWith]
                value:
                  description: 'The property value.'
                  oneOf: [{ title: String, type: string }, { title: Array, type: array, items: { type: string } }]
              type: object
              additionalProperties: false
        -
          name: include
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - invoices
        -
          name: per_page
          in: query
          description: 'Number of items per page. Default: 15, Max: 100. A larger value is reduced to the maximum; omitting it or sending 0 selects the default.'
          required: false
          schema:
            type: integer
            minimum: 0
            example: 15
        -
          name: page
          in: query
          description: 'Page number. Omitting it or sending 0 selects the first page.'
          required: false
          schema:
            type: integer
            minimum: 0
            example: 1
      responses:
        '200':
          description: 'List customers'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CustomerResource' }, x-description-ignore: true, x-example-ignore: true }
                  meta: { description: 'Pagination meta data', properties: { current_page: { description: 'The current page number', type: integer, example: 1 }, from: { description: 'The first item being returned in the current page', type: integer, example: 1, nullable: true }, path: { description: 'The base path for the paginated results', type: string, example: 'https://api.example.com/items' }, per_page: { description: 'The number of items shown per page', type: integer, example: 15 }, to: { description: 'The last item being returned in the current page', type: integer, example: 15, nullable: true } }, type: object, x-example-ignore: true }
                  links: { description: 'Pagination links', properties: { first: { description: 'URL to the first page', type: string, example: 'https://api.example.com/items?page=1', nullable: true }, last: { description: 'URL to the last page', type: string, example: null, nullable: true }, prev: { description: 'URL to the previous page', type: string, example: null, nullable: true }, next: { description: 'URL to the next page', type: string, example: 'https://api.example.com/items?page=17', nullable: true } }, type: object, x-example-ignore: true }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: 'Too Many Requests'
          content:
            application/json:
              schema:
                properties:
                  message: { description: 'Too Many Requests', type: string, example: 'Too Many Requests' }
                type: object
      x-feature_flag: beta-customers
  /api/v1/customers/lookup:
