components:
  schemas:
    CreateInvoiceRequest:
      required:
        - customer_id
        - invoice_number
        - status
        - total_amount
      properties:
        customer_id:
          description: 'ID of the customer'
          type: integer
        invoice_number:
          type: string
          maxLength: 50
        status:
          enum:
            - sent
            - paid
            - overdue
        total_amount:
          type: number
          format: decimal
          minimum: 0
        issued_at:
          type:
            - string
            - 'null'
          format: date
        due_at:
          type:
            - string
            - 'null'
          format: date
        paid_at:
          type:
            - string
            - 'null'
          format: date
      type: object
    CustomerResource:
      required:
        - id
        - name
        - email
        - country
        - is_active
        - is_verified
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Acme Corporation'
        email:
          type: string
          format: email
          example: contact@acme.com
        phone:
          type:
            - string
            - 'null'
          example: +1-555-0123
        country:
          type: string
          example: US
        is_active:
          type: boolean
          example: true
        is_verified:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00+00:00'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00+00:00'
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceResource'
      type: object
      additionalProperties: false
    InvoiceFilterCondition:
      title: Condition
      properties:
        key:
          type: string
          enum:
            - id
            - invoice_number
            - status
            - issued_at
            - due_at
            - paid_at
            - created_at
            - updated_at
        op:
          description: operator
          type: string
          enum:
            - equals
            - notEquals
            - in
            - notIn
            - isNull
            - isNotNull
            - contains
            - notContains
            - startsWith
            - endsWith
            - lessThan
            - lessThanOrEquals
            - greaterThan
            - greaterThanOrEquals
        value:
          description: 'The property value.'
          oneOf:
            -
              title: String
              type: string
            -
              title: Array
              type: array
              items:
                type: string
      type: object
      additionalProperties: false
    InvoiceFilterGroup:
      title: 'Filter group'
      description: 'A boolean group of filter conditions. A condition may be a group itself, nesting to at most 5 levels.'
      required:
        - op
        - conditions
      properties:
        op:
          description: 'Boolean operator combining the conditions.'
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            oneOf:
              -
                $ref: '#/components/schemas/InvoiceFilterCondition'
              -
                $ref: '#/components/schemas/InvoiceFilterGroupDepth2'
      type: object
      additionalProperties: false
    InvoiceFilterGroupDepth2:
      title: 'Filter group, level 2'
      description: 'A filter group nested at level 2 of at most 5.'
      required:
        - op
        - conditions
      properties:
        op:
          description: 'Boolean operator combining the conditions.'
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            oneOf:
              -
                $ref: '#/components/schemas/InvoiceFilterCondition'
              -
                $ref: '#/components/schemas/InvoiceFilterGroupDepth3'
      type: object
      additionalProperties: false
    InvoiceFilterGroupDepth3:
      title: 'Filter group, level 3'
      description: 'A filter group nested at level 3 of at most 5.'
      required:
        - op
        - conditions
      properties:
        op:
          description: 'Boolean operator combining the conditions.'
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
            oneOf:
              -
                $ref: '#/components/schemas/InvoiceFilterCondition'
              -
                $ref: '#/components/schemas/InvoiceFilterGroupDepth4'
      type: object
      additionalProperties: false
    InvoiceFilterGroupDepth4:
      title: 'Filter group, level 4'
      description: 'A filter group nested at level 4 of at most 5.'
      required:
        - op
        - conditions
      properties:
        op:
          description: 'Boolean operator combining the conditions.'
          type: string
          enum:
            - and
            - or
        conditions:
          type: array
          items:
